name: ci

# 每次推 main / 发 PR 时跑：格式、wasm 目标编译、测试、config.json 与文案自检。
# 打 tag 的构建与发布在 release.yml，这里不重复打包。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      # 插件跑在 wasm32-wasip1 上，宿主编译通过不代表这里能编。
      - name: 编译 wasm 目标
        run: cargo check --locked --target wasm32-wasip1

      - name: 测试
        run: cargo test --locked

      # config.json 是宿主直接读的协议文件：写坏一个字段，插件面板就整块不显示。
      # 这个仓库还多一项 remote_types —— 宿主会在插件启用时把它塞进"新建远程"的类型下拉。
      - name: 校验 config.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys, tomllib

          cfg = json.load(open("config.json", encoding="utf-8"))
          ps = cfg["plugin_setting"]
          pages = [p["id"] for p in ps["pages"]]
          errors = []

          # 每个控件要么落在已声明的页上，要么是可不分页的公共控件。
          for c in ps["controls"]:
              if "page" not in c and c.get("kind") not in ("status", "progress", "checks"):
                  errors.append(f"{c['key']}: 缺少 page")
              elif c.get("page") and c["page"] not in pages:
                  errors.append(f"{c['key']}: page {c['page']!r} 未在 pages 中声明")

          # 同一 line 的控件必须同页，否则宿主排版会把它拆到两页。
          by_line = {}
          for c in ps["controls"]:
              if "line" in c:
                  by_line.setdefault(c["line"], set()).add(c.get("page"))
          for line, owners in by_line.items():
              if len(owners) > 1:
                  errors.append(f"line {line!r} 跨页: {sorted(owners)}")

          # select 没有 options 就必须声明 dynamic，由宿主向插件要候选。
          for c in ps["controls"]:
              if c.get("field") == "select" and "options" not in c and not c.get("dynamic"):
                  errors.append(f"{c['key']}: select 既无 options 也没声明 dynamic")

          # action 必须有 label，否则渲染成一个没有文字的按钮。
          for c in ps["controls"]:
              if c.get("kind") == "action" and not c.get("label"):
                  errors.append(f"{c['key']}: action 缺少 label")

          keys = [c["key"] for c in ps["controls"]]
          dup = sorted({k for k in keys if keys.count(k) > 1})
          if dup:
              errors.append(f"控件 key 重复: {dup}")

          # capabilities 只能写宿主真会执行的能力组。宿主只认下面这八个名字，
          # 多一个就整份 config.json 被拒，插件加载不起来。
          cap_groups = ("kv", "ui", "fs", "http", "proc", "net", "rclone", "env")
          caps = cfg.get("capabilities", [])
          for cap in caps:
              # remote_types 是元数据：它描述"新建远程时多给一个预设类型"，
              # 描述不了插件能调用的操作，所以不该、也不能写进 capabilities。
              if cap == "remote_types":
                  errors.append("capabilities 里有 remote_types：它是元数据，不是能力组")
              elif cap not in cap_groups:
                  errors.append(f"capabilities 里有宿主不认识的能力组: {cap}（可用：{' / '.join(cap_groups)}）")
          if len(set(caps)) != len(caps):
              errors.append(f"capabilities 有重复项: {caps}")

          # 这里声明的派生类型是"预设一组参数"，不是新的 rclone 后端：
          # base_type 决定真正写进 rclone.conf 的 type，defaults 里不能再写 type。
          rts = cfg.get("remote_types", [])
          if rts:
              ids = [rt.get("id", "") for rt in rts]
              if len(set(ids)) != len(ids):
                  errors.append(f"remote_types id 重复: {ids}")
              for rt in rts:
                  rid, base = rt.get("id", ""), rt.get("base_type", "")
                  if not re.fullmatch(r"[A-Za-z0-9._-]{2,64}", rid):
                      errors.append(f"remote_types id 不合法: {rid!r}")
                  if not rt.get("name"):
                      errors.append(f"{rid}: 缺少 name，新建远程的下拉框要显示它")
                  if not base:
                      errors.append(f"{rid}: 缺少 base_type")
                  elif rid == base:
                      errors.append(f"{rid}: base_type 不能等于自己的 id")
                  elif not re.fullmatch(r"[a-z0-9_]+", base):
                      errors.append(f"{rid}: base_type 不是合法的后端名: {base!r}")
                  if "type" in rt.get("defaults", {}):
                      errors.append(f"{rid}: defaults 不能设置 type，它由 base_type 决定")
                  for k, v in rt.get("defaults", {}).items():
                      if not k:
                          errors.append(f"{rid}: defaults 里有空键")
                      if len(str(v).encode()) > 4096:
                          errors.append(f"{rid}.{k}: 值超过 4096 字节")

          # config.json 与 Cargo.toml 的版本必须一致，否则 tag 校验会先挡住发布。
          cargo_ver = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          if cargo_ver != cfg["version"]:
              errors.append(f"Cargo.toml {cargo_ver} != config.json {cfg['version']}")

          print(f"pages={pages} controls={len(ps['controls'])} remote_types={[rt.get('id') for rt in rts]} version={cfg['version']}")
          for e in errors:
              print("error: " + e, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY

      # 少一条英文就等于英文界面里露出一段中文（或反过来）。
      - name: 校验中英文案
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys

          t = json.load(open("src/i18n.json", encoding="utf-8"))
          zh, en = t["zh"], t["en"]
          errors = []

          for k in sorted(set(zh) - set(en)):
              errors.append(f"只有中文: {k}")
          for k in sorted(set(en) - set(zh)):
              errors.append(f"只有英文: {k}")

          # 占位符数量与编号必须一致，否则 f() 填错位置。
          ph = re.compile(r"\{\d*\}")
          for k in sorted(set(zh) & set(en)):
              a, b = sorted(ph.findall(zh[k])), sorted(ph.findall(en[k]))
              if a != b:
                  errors.append(f"{k}: 占位符不一致 {a} vs {b}")

          # 代码里 t("…") 用到的键必须真的存在，否则界面会原样显示那个键名。
          import pathlib
          missing = set()
          for p in pathlib.Path("src").glob("*.rs"):
              for key in re.findall(r'(?<![A-Za-z0-9_])t\(\s*"([^"]+)"', p.read_text(encoding="utf-8")):
                  if key not in zh:
                      missing.add(key)
          for k in sorted(missing):
              errors.append(f"代码用到但文案里没有: {k}")

          print(f"zh={len(zh)} en={len(en)}")
          for e in errors:
              print("error: " + e, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY
      # 打包这一步证明的是"能发得出去"：config.json、wasm、check.sha256 三件齐、
      # 清单里的哈希和包里文件对得上。只编过 wasm 不代表能装。
      - name: 打包 WASI 包并校验
        run: |
          set -euo pipefail
          bash scripts/pack.sh
          python3 - <<'PY'
          import hashlib, json, pathlib, sys, tomllib, zipfile

          cfg = json.load(open("config.json", encoding="utf-8"))
          pid, version = cfg["id"], cfg["version"]
          entry = cfg.get("entry") or "main.wasm"
          zip_path = pathlib.Path(f"dist/{pid}-{version}.zip")
          errors = []

          if not zip_path.exists():
              sys.exit(f"没有产物 {zip_path}")

          with zipfile.ZipFile(zip_path) as z:
              names = sorted(z.namelist())
              if names != ["check.sha256", "config.json", entry]:
                  errors.append(f"包内条目不对: {names}")
              blobs = {n: z.read(n) for n in names}

          # check.sha256 是宿主安装时真正核对的东西，行格式 "<sha256>  <file>"。
          for line in blobs["check.sha256"].decode().splitlines():
              want, name = line.split("  ", 1)
              got = hashlib.sha256(blobs.get(name, b"")).hexdigest()
              if got != want:
                  errors.append(f"{name}: 清单 {want} != 实际 {got}")

          if json.loads(blobs["config.json"])["version"] != version:
              errors.append("包内 config.json 版本和包名不一致")

          cargo_ver = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          if cargo_ver != version:
              errors.append(f"Cargo.toml {cargo_ver} != config.json {version}")

          print(f"包={zip_path} 条目={len(names)} 版本={version}")
          for e in errors:
              print("error: " + e, file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY
